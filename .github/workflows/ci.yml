name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint and unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
    # Clusterio 2.0 from source: the plugin builds inside Clusterio's pnpm workspace.
    - uses: actions/checkout@v7
      with:
        repository: clusterio/clusterio
        ref: v2.0.2
    - uses: actions/checkout@v7
      with:
        path: external_plugins/universal_edges
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
    - run: sudo apt-get update && sudo apt-get install -y lua5.2 lua-check zip
    - run: pnpm install --no-frozen-lockfile
    - run: pnpm build
    - run: pnpm --filter universal_edges run prepare
    - run: pnpm --filter universal_edges run lint
    - run: pnpm --filter universal_edges run test

  # A v* tag (npm version): the package to npm and the mod to the mod portal. npm's trusted publisher for the package
  # names this file, ci.yml.
  release:
    name: Release to npm and the mod portal
    needs: test
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    defaults:
      run:
        working-directory: external_plugins/universal_edges
    steps:
    - uses: actions/checkout@v7
      with:
        repository: clusterio/clusterio
        ref: v2.0.2
    - uses: actions/checkout@v7
      with:
        path: external_plugins/universal_edges
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
        registry-url: https://registry.npmjs.org
    - run: sudo apt-get update && sudo apt-get install -y zip
    - run: pnpm install --no-frozen-lockfile
      working-directory: .
    - run: pnpm build
      working-directory: .
    - run: pnpm run prepare
    - name: The tag, package.json, mod/info.json and module/module.json agree
      run: |
        version=$(jq -r .version package.json)
        test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, package.json $version"; exit 1; }
        test "$(jq -r .version mod/info.json)" = "$version"
        test "$(jq -r .version module/module.json)" = "$version"
        echo "VERSION=$version" >> "$GITHUB_ENV"
    # pnpm pack writes the workspace: and catalog: ranges out as versions; npm publishes the tarball (trusted
    # publishing needs npm 11.5.1 or later).
    - run: pnpm pack
    - run: npm install -g npm@11
    # Each step skips a version already out, so a release that failed halfway can be re-run.
    - name: Publish to npm
      run: |
        if npm view "universal_edges@$VERSION" version | grep -q .; then echo "npm has $VERSION"; exit 0; fi
        npm publish "universal_edges-$VERSION.tgz" --access public
    - name: Upload the mod to the mod portal
      env:
        FACTORIO_MOD_TOKEN: ${{ secrets.FACTORIO_MOD_TOKEN }}
      run: |
        if curl -sS --fail-with-body https://mods.factorio.com/api/mods/universal_edges \
          | jq -e --arg v "$VERSION" 'any(.releases[]; .version == $v)' > /dev/null; then
          echo "the mod portal has $VERSION"; exit 0
        fi
        url=$(curl -sS --fail-with-body -X POST https://mods.factorio.com/api/v2/mods/releases/init_upload \
          -H "Authorization: Bearer $FACTORIO_MOD_TOKEN" -F mod=universal_edges | jq -er .upload_url)
        curl -sS --fail-with-body -X POST "$url" -F "file=@dist/universal_edges_$VERSION.zip" | tee /dev/stderr | jq -e .success
